minimum_pre_commit_version: "3.7.0"

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: f4d7745e17a28aad7eed2f4874ca8d1568c11c4c # v22.1.8
    hooks:
      - id: clang-format
        args: [--style=file]
        stages: [pre-commit, pre-push]
        types_or: [c, c++]